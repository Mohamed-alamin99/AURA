[project]
name = "aura"
version = "0.1.0"
description = "Aura project"
readme = ""
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "fastapi>=0.141.1",
    "psycopg[binary]",
    "pydantic-settings>=2.15.0",
    "sqlalchemy",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
